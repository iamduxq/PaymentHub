<div class="space-y-6">
  <nav class="text-sm mb-2 mx-4">
    <div class="flex justify-between items-end mb-4">
      <h1 class="text-2xl font-semibold">
        Tham số danh mục theo nhóm
      </h1>
      <button 
      class="btn-add px-6 py-3 bg-teal-700 text-white rounded-lg content-center font-medium"
      (click)="redirectCreate()">
        + Thêm mới
      </button>
    </div>
  </nav>
  <!-- filter -->
  <app-category-filter (search)="onSearch($event)"></app-category-filter>

  <!-- table -->
  <app-category-table [categories]="categories"></app-category-table>

</div>
