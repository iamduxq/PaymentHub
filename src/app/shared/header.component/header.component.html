<header class="bg-white shadow-xs border-b border-gray-200 p-2">
    <div class="flex justify-between items-center px-6 py-1">
        <div class="flex-1">
            <h1 class="text-2xl font-bold text-teal-700">PAYMENT HUB</h1>
        </div>
        <div class="flex items-center gap-4">
            <!-- Thông báo -->
            <div class="notification cursor-pointer text-2xl ">
                🔔
            </div>

            <!-- Thay đổi ngôn ngữ -->
            <div class="change-language">
                <select id="language" name="language" class="border border-gray-300 rounded-md px-3 py-1.5 text-sm bg-white cursor-pointer
           focus:outline-none focus:ring-2 focus:ring-teal-600">
                    <option value="english">ENG</option>
                    <option value="vietnam">VIE</option>
                </select>
            </div>

            <div class="w-px h-6 bg-gray-300"></div>
            <div class="user cursor-pointer">
                <!-- <img [src]="avartar" alt=""> -->
                <h1 class="user text-xl">************</h1>
                <span class="role text-emerald-600 bg-emerald-200 rounded p-1">************</span>
            </div>
        </div>
    </div>
</header>
