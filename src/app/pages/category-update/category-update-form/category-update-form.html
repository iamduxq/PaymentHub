<div class="bg-white p-4 rounded-lg shadow mx-4 mb-4">
    <div class="grid grid-cols-4 gap-4 mb-4">

        <div class="flex flex-col">
            <label class="block font-medium">Danh mục theo nhóm <span class="required text-red-600">*</span></label>
            <input type="text" disabled [(ngModel)]="formData.paramType" class="bg-gray-300 border border-gray-400 rounded-lg py-2 px-3">
        </div>

        <div class="flex flex-col">
            <label class="block font-medium">Giá trị thành phần <span class="required text-red-600">*</span></label>
            <input type="text" required [(ngModel)]="formData.paramValue" class="border border-gray-400 rounded-lg py-2 px-3">
        </div>

        <div class="flex flex-col">
            <label class="block font-medium">Tên thành phần <span class="required text-red-600">*</span></label>
            <input type="text" required [(ngModel)]="formData.paramName" class="border border-gray-400 rounded-lg py-2 px-3">
        </div>

        <div class="flex flex-col">
            <label class="block font-medium">Cấu phần xử lý <span class="required text-red-600">*</span></label>
            <input type="text" required [(ngModel)]="formData.componentCode" class="border border-gray-400 rounded-lg py-2 px-3">
        </div>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-4">
        <div class="flex flex-col">
            <label class="block font-medium">Ngày hiệu lực <span class="required text-red-600">*</span></label>
            <input type="date" required name="" [ngModel]="formData.effectiveDate | date:'yyyy-MM-dd'" class="border border-gray-400 rounded-lg py-2 px-3">
        </div>

        <div class="flex flex-col">
            <label class="block font-medium">Ngày hết hiệu lực</label>
            <input type="date" [ngModel]="formData.endEffectiveDate | date:'yyyy-MM-dd'" class="border border-gray-400 rounded-lg py-2 px-3" />
        </div>
    </div>
    
    <div class="flex flex-col mb-2">
        <label class="block font-medium">Mô tả</label>
        <textarea rows="1" [(ngModel)]="formData.description" class="border border-gray-400 rounded-lg py-2 px-3 resize-none overflow-hidden" (input)="autoResize($event)"></textarea>
    </div>
</div>
